<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="edBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="videoShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#edBg)"/>

  <!-- Video Player Frame -->
  <g transform="translate(60, 40)" filter="url(#videoShadow)">
    <rect x="0" y="0" width="480" height="260" rx="16" fill="#0f172a"/>

    <!-- Screen Content / Mathematical Diagram inside video -->
    <rect x="15" y="15" width="450" height="190" rx="10" fill="#1e293b"/>
    
    <!-- Central Play Button / Pause Quiz Overlay -->
    <circle cx="240" cy="95" r="30" fill="#0284c7" fill-opacity="0.9"/>
    <polygon points="233,83 253,95 233,107" fill="#ffffff"/>

    <!-- Question Callout Overlay -->
    <g transform="translate(90, 130)">
      <rect x="0" y="0" width="300" height="60" rx="8" fill="#ffffff" filter="url(#videoShadow)"/>
      <rect x="8" y="8" width="6" height="44" rx="3" fill="#0284c7"/>
      <text x="24" y="26" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="12" fill="#0369a1">QUESTION 02 @ 02:45</text>
      <text x="24" y="46" font-family="'Segoe UI', sans-serif" font-size="13" fill="#1e293b">Why does the slope represent velocity?</text>
    </g>

    <!-- Video Timeline Bar -->
    <rect x="20" y="225" width="440" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="225" width="220" height="8" rx="4" fill="#0284c7"/>
    
    <!-- Question Drops / Timestamps on Bar -->
    <circle cx="90" cy="229" r="6" fill="#10b981"/>
    <circle cx="160" cy="229" r="6" fill="#10b981"/>
    <circle cx="240" cy="229" r="8" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
    <circle cx="340" cy="229" r="6" fill="#94a3b8"/>
    <circle cx="420" cy="229" r="6" fill="#94a3b8"/>

    <text x="20" y="248" font-family="'Segoe UI', monospace" font-size="11" fill="#94a3b8">02:45 / 06:12</text>
    <text x="390" y="248" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">HD • Edpuzzle</text>
  </g>

  <!-- Bottom Tag Pill -->
  <g transform="translate(50, 325)">
    <rect x="0" y="0" width="160" height="42" rx="21" fill="#0284c7"/>
    <text x="18" y="26" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Digital Learning</text>
  </g>
  <text x="230" y="352" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#0369a1">Interactive Video Assessment • Edpuzzle</text>
</svg>

