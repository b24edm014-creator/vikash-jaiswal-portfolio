<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="speedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="graphCurveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="animShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f97316" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#speedBg)"/>

  <!-- Graph Frame -->
  <g transform="translate(60, 40)" filter="url(#animShadow)">
    <rect x="0" y="0" width="480" height="260" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>

    <!-- Axes -->
    <line x1="60" y1="210" x2="430" y2="210" stroke="#9a3412" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="60" y1="210" x2="60" y2="35" stroke="#9a3412" stroke-width="2.5"/>
    <text x="410" y="235" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13" fill="#9a3412">Time (t)</text>
    <text x="20" y="35" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="13" fill="#9a3412">Distance (s)</text>

    <!-- Grid lines -->
    <line x1="60" y1="160" x2="420" y2="160" stroke="#ffedd5" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="60" y1="110" x2="420" y2="110" stroke="#ffedd5" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="60" y1="60" x2="420" y2="60" stroke="#ffedd5" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Actual Path (Nonlinear Curve) -->
    <path d="M 60,210 Q 140,200 200,140 T 320,90 T 400,50" fill="none" stroke="url(#graphCurveGrad)" stroke-width="4"/>

    <!-- Secant Line (Average Speed Slope) -->
    <line x1="60" y1="210" x2="400" y2="50" stroke="#0284c7" stroke-width="3" stroke-dasharray="6,4"/>

    <!-- Key Points -->
    <circle cx="60" cy="210" r="6" fill="#f97316"/>
    <circle cx="400" cy="50" r="6" fill="#0284c7"/>

    <!-- Animated Car / Object Indicator -->
    <g transform="translate(230, 115)">
      <circle cx="0" cy="0" r="14" fill="#f97316"/>
      <polygon points="-4,-7 8,0 -4,7" fill="#ffffff"/>
    </g>

    <!-- Formula Badge -->
    <g transform="translate(190, 150)">
      <rect x="0" y="0" width="190" height="42" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
      <text x="12" y="26" font-family="'Segoe UI', monospace" font-size="14" font-weight="bold" fill="#c2410c">v_avg = Δs / Δt</text>
    </g>
  </g>

  <!-- Bottom Tag Pill -->
  <g transform="translate(50, 325)">
    <rect x="0" y="0" width="200" height="42" rx="21" fill="#f97316"/>
    <text x="18" y="26" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Mathematics Education</text>
  </g>
  <text x="270" y="352" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#9a3412">Visual Animation • Rate of Change</text>
</svg>

