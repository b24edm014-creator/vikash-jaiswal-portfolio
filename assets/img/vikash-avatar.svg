<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Card / Circle -->
  <rect x="20" y="20" width="360" height="400" rx="40" fill="url(#bgGrad)" filter="url(#softShadow)" />
  
  <!-- Subtle Math & EdTech Motifs in Background -->
  <g opacity="0.25" stroke="#8b5cf6" stroke-width="2" fill="none">
    <!-- Pi symbol -->
    <path d="M 60,70 L 100,70 M 72,70 L 72,100 M 88,70 L 88,95 Q 88,100 94,100" />
    <!-- Integral symbol -->
    <path d="M 330,80 Q 340,65 350,65 Q 355,65 355,75 L 340,115 Q 335,125 330,125 Q 320,125 330,115" />
    <!-- Sigma -->
    <path d="M 60,330 L 90,330 L 75,350 L 90,370 L 60,370" />
    <!-- Binary / Code brackets -->
    <text x="320" y="340" font-family="monospace" font-size="28" font-weight="bold" fill="#0284c7" stroke="none">&lt;/&gt;</text>
    <!-- Geometric Compass / Triangle -->
    <polygon points="310,180 340,230 280,230" stroke="#f97316" stroke-width="2" />
  </g>

  <!-- Profile Silhouette / Avatar Base -->
  <!-- Shoulders / Blazer -->
  <path d="M 110,400 C 110,320 150,300 200,300 C 250,300 290,320 290,400 Z" fill="#312e81" />
  <!-- Shirt Collar -->
  <polygon points="200,340 180,300 220,300" fill="#ffffff" />
  <polygon points="200,360 190,305 200,300 210,305" fill="#f97316" />

  <!-- Neck -->
  <rect x="182" y="250" width="36" height="60" rx="8" fill="#fed7aa" />

  <!-- Head -->
  <ellipse cx="200" cy="205" rx="58" ry="68" fill="#ffedd5" />

  <!-- Hair -->
  <path d="M 142,195 C 140,140 170,130 200,130 C 235,130 260,142 258,195 C 252,165 240,148 200,148 C 165,148 148,168 142,195 Z" fill="#1e1b4b" />

  <!-- Glasses -->
  <g stroke="#1e1b4b" stroke-width="4" fill="none">
    <rect x="160" y="190" width="32" height="24" rx="6" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="208" y="190" width="32" height="24" rx="6" fill="#ffffff" fill-opacity="0.3"/>
    <line x1="192" y1="202" x2="208" y2="202" />
    <line x1="148" y1="200" x2="160" y2="202" />
    <line x1="240" y1="202" x2="252" y2="200" />
  </g>

  <!-- Smile -->
  <path d="M 188,240 Q 200,248 212,240" stroke="#c2410c" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Educator Badge Floating Pill -->
  <g transform="translate(110, 360)" filter="url(#softShadow)">
    <rect x="0" y="0" width="180" height="38" rx="19" fill="#ffffff" />
    <circle cx="20" cy="19" r="10" fill="#10b981" />
    <path d="M 16,19 L 19,22 L 25,16" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
    <text x="38" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#1e1b4b">IIT Jodhpur • BSc BEd</text>
  </g>
</svg>

